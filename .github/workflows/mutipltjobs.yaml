name: multi job
on:
   workflow_dispatch:
jobs:
  job1:
    name: installation
    runs-on: ubuntu-latest
    steps:
      - name: installation
        run: sudo apt install cowsay -y
      - name: run the cmd
        run: cowsay -f dragon "this is my place i am dragon" >> ash.txt
      - uses: actions/upload-artifact@v4
        with:
          path: ash.txt
  job2:
    needs: job1
    name: job 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: read te file
        run: cat ash.txt
      - name: find the word "place"
        run: grep -i place ash.txt     